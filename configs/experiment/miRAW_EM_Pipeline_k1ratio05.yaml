# @package _global_
# Selector ablation k1_ratio=0.5. Inherits em_core + bench (the original carried bench),
# overrides only the 2 keys that differ from miRAW_EM_Pipeline (k1_ratio, and the clean
# instance_mode value vs em_core's preserved full-width-quote value).
defaults:
  - _base/em_core
  - _base/em_bench
  - _self_

em:
  selector_module:
    cfg:
      k1_ratio: 0.5
  policy:
    instance_mode: "hybrid"
