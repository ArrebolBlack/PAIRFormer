# @package _global_
# configs/experiment/deepTargetPro_EM_Pipeline_ext150.yaml
# EXP4 Stage 3 (Extended): EM pipeline on deepTargetPro, 150 epochs, monitor=F1
# Derived from deepTargetPro_EM_Pipeline.yaml with the following changes:
#   - num_epochs: 100 -> 150
#   - monitor: loss -> f1
#   - greater_is_better: false -> true
#   - scheduler_t_max: follows num_epochs (150)

defaults:
  - deepTargetPro_EM_Pipeline

# Override epochs
run:
  num_epochs: 150

trainer_em:
  num_epochs: 150
  monitor: f1
  greater_is_better: true
  scheduler_t_max: 150
