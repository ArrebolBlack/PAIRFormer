# @package _global_
# DeepMirTar window-level TargetNet_Optimized. Inherits window_tnopt_core; overrides only
# the 10 keys the snapshot diff showed differ from deepTargetPro_TargetNet_Optimized.
defaults:
  - _base/window_tnopt_core
  - _self_

experiment:
  name: DeepMirTar_TargetNet_Optimized

data:
  name: mirna_DeepMirTar
  path:
    train: "data/DeepMirTar/train_seed_1234.txt"
    val: "data/DeepMirTar/valid_seed_1234.txt"
    test: "data/DeepMirTar/test_seed_1234.txt"

run:
  batch_size: 64
  num_epochs: 120

train:
  scheduler_t_max: 120

logging:
  wandb:
    group: DeepMirTar_TargetNet_Optimized_baseline
    tags: ["TargetNet_Optimized", "DeepMirTar", "Stage-1"]
