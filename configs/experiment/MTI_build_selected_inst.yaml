# @package _global_

experiment_name: MTI_build_selected_inst
experiment:
  name: MTI_build_selected_inst
  task: scalable_selected_inst_build

seed: 2020
device: cuda

paths:
  output_root: outputs
  cache_root: cache
  logs_root: logs

data:
  name: mirna_MTI
  path:
    train: data/MTI/MTI_pair_random_split.txt
    val: data/MTI/MTI_pair_random_split.txt
    test: data/MTI/MTI_pair_random_split.txt
  with_esa: true
  split_column: 6
  col_mirna_seq: 4
  col_mrna_seq: 2
  col_label: 5
  split_map:
    train: train
    val: val
    test: test

run:
  mode: build_selected_inst_cache
  split: train
  batch_size: 64
  num_workers: 4
  has_inst_logit: true

scalable:
  cache_root: ${paths.cache_root}

instance_ckpt_path: checkpoints/CheapCTSNet/checkpoints/best.pt

# DDP 支持
ddp:
  local_rank: 0
  world_size: 1

instance_model:
  name: targetnet_optimized
  arch: TargetNet_Optimized
  num_channels: [16, 16, 32, 32]
  num_blocks: [1, 1, 1, 1]
  pool_size: 3
  stem_kernel_size: 5
  block_kernel_size: 3
  skip_connection: true
  dropout: 0.5
  multi_scale: false
  se_type: basic
  use_bn: false
  se_reduction: 8
  target_output_length: 12
  arch_variant: opt4_tiny
