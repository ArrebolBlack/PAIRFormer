# @package _global_
# deepTargetPro EM pipeline — inherits _base/em_core, overrides ONLY the keys that
# differ from miRAW (extracted via cfgdiff against the golden snapshots: 13 keys).
# Composed result unchanged vs pre-refactor snapshot (cfgdiff = 0).
defaults:
  - _base/em_core
  - _self_

experiment:
  name: deepTargetPro_EM_Pipeline

data:
  name: mirna_deepTargetPro
  path:
    train: "data/deepTargetPro/deepTargetPro_Test1-5_split-ratio-0.9_Train_Validation.txt"
    val: "data/deepTargetPro/deepTargetPro_Test1-5_split-ratio-0.9_Train_Validation.txt"
    test: "data/deepTargetPro/deepTargetPro_Test_total.txt"

run:
  batch_size: 32
  num_workers: 8
  num_epochs: 80
  eval_test_after_train: false

em:
  policy:
    warmup_epochs: 40

logging:
  wandb:
    project: "rebuttal_EXP2_deepTargetPro"
    group: "deepTargetPro_Route1"
    tags: ["EXP2", "Route1", "deepTargetPro", "EM"]
