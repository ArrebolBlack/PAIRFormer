# @package _global_
# K=512 experiment: PairSetTransformerAggregator X-Large, kmax=512
experiment_name: MTI_EM_K512
experiment:
  name: MTI_EM_K512
  task: em_pair_level_train
seed: 2020
device: cuda
paths:
  output_root: outputs
  cache_root: cache
  logs_root: logs
data:
  name: mirna_MTI
  path:
    train: data/MTI/MTI_pair_random_split.txt
    val: data/MTI/MTI_pair_random_split.txt
    test: data/MTI/MTI_pair_random_split.txt
  with_esa: true
  split_column: 6
  col_mirna_seq: 4
  col_mrna_seq: 2
  col_label: 5
  split_map:
    train: train
    val: val
    test: test
run:
  mode: train
  split: train
  val_split: val
  batch_size: 128
  num_workers: 8
  pin_memory: true
  num_epochs: 80
  kmax: 512
  include_pos: true
  include_esa: true
  cache_path: ${paths.cache_root}
  ckpt_subdir: checkpoints
  eval_subdir: eval
  ckpt_dir: ${hydra:run.dir}/${run.ckpt_subdir}
  eval_dir: ${hydra:run.dir}/${run.eval_subdir}
  resume: false
  checkpoint: null
  eval_test_after_train: false
  test_splits:
  - test
  eval_test_with_last: true
  eval_test_with_best: true
  best_ckpt_path: null
  test_instance_mode: online
  train_reduction: none
  eval_reduction: none
  test_reduction: none
  train_topk: 3
  eval_topk: 3
  test_topk: 3
  train_softmax_temp: 1.0
  eval_softmax_temp: 1.0
  test_softmax_temp: 1.0
  train_instance_mode: online
  val_instance_mode: online
  force_overwrite_bootstrap: false
  refresh_instance_after_update: false
em:
  controller:
    refresh_on_rank0_only: true
    barrier_after_refresh: true
    rebuild_train_loader_after_selection_refresh: true
    verbose: true
  inst_emb_dim: 1536
  inst_version: inst_v0
  cheap_emb_dim: 64
  cheap_version: cheap_v0
  cheap_cache:
    batch_size: 10240
    num_workers: 16
    amp: true
    has_entropy: false
  instance_cache:
    batch_size: 10240
    num_workers: 16
    use_amp: true
    normalize_emb: false
  bootstrap:
    enabled: true
    skip_instance_cache: true
  selector_module:
    _target_: src.selectors.selector_module.SelectorModule
    cfg:
      _target_: src.selectors.st_selector.STSelectorConfig
      kmax: ${run.kmax}
      k1_ratio: 1
      score_use_sigmoid: false
      exploration_sigma: 0.0
      base_seed: ${seed}
      pos_bin_eps: 1e-6
      use_hash_dedup: true
      hash_seed: ${seed}
      score_norm_z: true
      score_norm_eps: 1e-6
      quota_top_t: 8
      quota_tau_w: 1.0
  sel_version: null
  selection_cache:
    pair_batch_size: 10240
    candidate_pool_size: None
    candidate_pool_mode: topn
    candidate_pool_topn_ratio: 1.0
    candidate_pool_seed: ${seed}
  policy:
    warmup_epochs: 40
    instance_mode: hybrid
    instance_update_every_epochs: 0
    instance_update_steps: 0
    cheap_mode: cached
    cheap_update_every_steps: 0
    cheap_update_every_epochs: 0
    cheap_update_steps: 0
    refresh_cheap_cache_every_epochs: 0
    refresh_selection_cache_every_epochs: 0
    refresh_instance_cache_every_epochs: 0
    refresh_selection_follows_cheap: true
    refresh_instance_follows_selection: true
em_cache_root: ${paths.cache_root}
cheap_ckpt_path: checkpoints/MTI_CheapCTSNet/checkpoints/best.pt
instance_ckpt_path: checkpoints/MTI_TargetNet_Optimized/checkpoints/best.pt
token_provider:
  cache_missing: error
  use_amp: false
  normalize_tokens: false
  assemble:
    use_inst_emb: true
    use_inst_logit: true
    use_esa: true
    use_pos: true
cheap_model:
  name: CheapCTSNet
  arch: CheapCTSNet_TinyConv
  meta_mode: logit_only
  meta_dropout: 0.2
  emb_dim: 64
  use_diff: true
  dropout: 0.0
  logit_hidden_dim: 64
  c1: 16
  c2: 32
  k1: 5
  k2: 3
  s1: 2
  s2: 2
instance_model:
  name: targetnet_optimized
  arch: TargetNet_Optimized
  num_channels:
  - 64
  - 64
  - 128
  - 128
  num_blocks:
  - 3
  - 3
  - 3
  - 3
  pool_size: 3
  stem_kernel_size: 5
  block_kernel_size: 3
  skip_connection: true
  dropout: 0.5
  multi_scale: true
  se_type: basic
  use_bn: true
  se_reduction: 8
  target_output_length: 12
  arch_variant: opt4_tiny
model:
  arch: PairSetTransformerAggregator
  name: pair_set_transformer_k512
  in_dim: 1539
  d_model: 1024
  n_heads: 16
  dim_ff: 4096
  dropout: 0.1
  ff_activation: gelu
  n_layers: 4
  block_type: sab
  num_inducing_points: 16
  num_seeds: 1
  use_output_sab: false
trainer_em:
  num_epochs: ${run.num_epochs}
  log_every: 50
  grad_accum_steps: 1
  clip_grad_norm: 0.0
  use_amp: false
  loss_type: focal
  esa_weighting: true
  focal_alpha: 0.4
  focal_gamma: 1.0
  focal_lambda: 1.0
  label_smoothing: true
  smooth_neg: 0.05
  smooth_pos: 0.95
  bce_lambda: 0.01
  pos_weight: 1.0
  bce_pos_weight: 1.0
  esa_scale: 10.0
  esa_lambda_pos: 1.0
  esa_lambda_neg: 0.5
  optimizer: adamw
  betas:
  - 0.9
  - 0.999
  eps: 1e-8
  amsgrad: false
  lr_agg: 5e-5
  wd_agg: 1e-2
  lr_inst: 5e-5
  wd_inst: 0.0
  scheduler_agg: cosine
  scheduler_inst: cosine
  scheduler_t_max: ${run.num_epochs}
  scheduler_step_size: 10
  scheduler_gamma: 0.1
  scheduler_factor: 0.2
  scheduler_patience: 5
  monitor: f1
  greater_is_better: true
  ema_enabled: true
  ema_decay: 0.999
task:
  problem_type: binary_classification
  from_logits: true
  threshold: 0.5
  ranking:
    enabled: true
    ks:
    - 1
    - 10
    - 32
    - 64
    - 128
    - 512
    compute_topk_overlap: true
    bucket:
      strategy: quantile
      num_buckets: 5
eval:
  save_dir: eval_outputs
  do_threshold_sweep: true
  sweep_num_thresholds: 101
  use_val_best_threshold: false
  best_threshold_path: null
  save_metrics_json: true
  save_report_txt: true
  save_threshold_csv: true
  save_curves_png: true
  roc_curve_file: roc_curve.png
  pr_curve_file: pr_curve.png
logging:
  wandb:
    enabled: true
    project: MTI_EM_K512
    entity: null
    mode: online
    group: MTI_RandomSplit_K512
    tags:
    - MTI
    - EM
    - K512
    - X-Large
  eval:
    use_wandb: false
    wandb_prefix: eval
