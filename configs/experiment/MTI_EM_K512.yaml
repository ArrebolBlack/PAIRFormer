# @package _global_
# K=512 X-Large variant. Inherits mti_em_core (NO bench, as in the original full-copy),
# overrides only the 15 keys the snapshot diff showed differ from MTI_EM_Pipeline.
defaults:
  - _base/mti_em_core
  - _self_

experiment:
  name: MTI_EM_K512

model:
  name: pair_set_transformer_k512
  in_dim: 1539
  d_model: 1024
  n_heads: 16
  n_layers: 4
  dim_ff: 4096

run:
  batch_size: 128
  kmax: 512

task:
  ranking:
    ks: [1, 10, 32, 64, 128, 512]

trainer_em:
  lr_agg: 0.00005
  lr_inst: 0.00005

logging:
  wandb:
    project: "MTI_EM_K512"
    group: "MTI_RandomSplit_K512"
    tags: ["MTI", "EM", "K512", "X-Large"]
