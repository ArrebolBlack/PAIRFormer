# @package _global_

experiment_name: MTI_build_teacher_shards
experiment:
  name: MTI_build_teacher_shards
  task: build_teacher_shards

seed: 2020
device: cuda

paths:
  output_root: outputs
  cache_root: cache
  logs_root: logs

data:
  name: mirna_MTI
  path:
    train: data/MTI/MTI_pair_random_split.txt
    val: data/MTI/MTI_pair_random_split.txt
    test: data/MTI/MTI_pair_random_split.txt
  with_esa: true
  split_column: 6
  col_mirna_seq: 4
  col_mrna_seq: 2
  col_label: 5
  split_map:
    train: train
    val: val
    test: test

run:
  mode: build_teacher_shards
  split: train
  batch_size: 2048
  distill_teacher_arch: TargetNet_Optimized
  distill_teacher_ckpt: checkpoints/MTI_TargetNet_Optimized/checkpoints/best.pt
  distill_teacher_amp: true
  distill_need_feat: true
  distill_teacher_feat_dim: 384
  distill_teacher_model:
    name: targetnet_optimized
    arch: TargetNet_Optimized
    num_channels: [16, 16, 32, 32]
    num_blocks: [1, 1, 1, 1]
    pool_size: 3
    stem_kernel_size: 5
    block_kernel_size: 3
    skip_connection: true
    dropout: 0.5
    multi_scale: false
    se_type: basic
    use_bn: false
    se_reduction: 8
    target_output_length: 12
    arch_variant: opt4_tiny

scalable:
  cache_root: ${paths.cache_root}
