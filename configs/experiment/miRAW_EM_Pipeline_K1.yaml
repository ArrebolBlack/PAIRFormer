# @package _global_
# configs/experiment/miRAW_EM_Pipeline_K1.yaml
# EXP PLAN 3.1: miRAW K=1 baseline — only the single best CTS window
# Inherits from miRAW_EM_Pipeline.yaml, overrides kmax and training params

defaults:
  - miRAW_EM_Pipeline

experiment_name: "miRAW_EM_Pipeline_K1"
experiment:
  name: "miRAW_EM_Pipeline_K1"

run:
  kmax: 1
  num_epochs: 100
  eval_test_after_train: true
  eval_test_with_last: true
  eval_test_with_best: true

em:
  selector_module:
    cfg:
      k1_ratio: 1.0
  policy:
    warmup_epochs: 0

trainer_em:
  num_epochs: 100
  lr_agg: 5e-5
  lr_inst: 0.0
  wd_inst: 0.0
  scheduler_t_max: 100
  monitor: f1
  greater_is_better: true
