# @package _global_
# DeepTargetPro clean split: zero pair overlap, neg-padded 1:1 balance
# K=1 baseline

defaults:
  - deepTargetPro_EM_Pipeline

experiment_name: "deepTargetPro_clean_split_K1"
experiment:
  name: "deepTargetPro_clean_split_K1"

seed: 2020

paths:
  cache_root: "cache_deeptargetpro_clean"

data:
  path:
    train: "data/rebuttal/deepTargetPro_clean_split/deepTargetPro_Train_Validation.txt"
    val:   "data/rebuttal/deepTargetPro_clean_split/deepTargetPro_Train_Validation.txt"
    test:  "data/rebuttal/deepTargetPro_clean_split/deepTargetPro_Test.txt"

run:
  kmax: 1
  num_epochs: 100
  eval_test_after_train: true
  eval_test_with_last: true
  eval_test_with_best: true
  test_instance_mode: online
  force_overwrite_bootstrap: true

em:
  selector_module:
    cfg:
      k1_ratio: 1.0
  policy:
    warmup_epochs: 0

trainer_em:
  num_epochs: 100
  lr_agg: 5e-5
  lr_inst: 0.0
  wd_inst: 0.0
  scheduler_t_max: 100
  monitor: f1
  greater_is_better: true

logging:
  wandb:
    project: "deepTargetPro_clean_split"
    tags: ["clean_split", "K1", "rebuttal"]
