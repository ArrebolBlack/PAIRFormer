# @package _global_
# Mixed: training negatives = 395 (from 80/20 split) + 468 (Stage 1 CTS)
# Same test set as 80/20 split, warmup=30

defaults:
  - miRAW_EM_Pipeline

experiment_name: "miRAW_mixed_8020_K64"
experiment:
  name: "miRAW_mixed_8020_K64"

seed: 2020

paths:
  cache_root: "cache_miRAW_mixed8020"

data:
  path:
    train: "data/rebuttal/miRAW_mixed_8020/miRAW_Train_Validation.txt"
    val:   "data/rebuttal/miRAW_mixed_8020/miRAW_Train_Validation.txt"
    test:  "data/rebuttal/miRAW_mixed_8020/miRAW_Test.txt"

run:
  kmax: 64
  num_epochs: 100
  eval_test_after_train: true
  eval_test_with_last: true
  eval_test_with_best: true
  test_instance_mode: online
  force_overwrite_bootstrap: true

em:
  policy:
    warmup_epochs: 30

trainer_em:
  num_epochs: 100
  monitor: f1
  greater_is_better: true

logging:
  wandb:
    project: "miRAW_mixed8020"
    tags: ["mixed", "K64", "warmup30"]
