# @package _global_
# K=1024 X-Large variant. Inherits mti_em_core (NO bench), overrides the 15 keys that
# differ from MTI_EM_Pipeline.
defaults:
  - _base/mti_em_core
  - _self_

experiment:
  name: MTI_EM_K1024

model:
  name: pair_set_transformer_k1024
  in_dim: 1539
  d_model: 1024
  n_heads: 16
  n_layers: 4
  dim_ff: 4096

run:
  batch_size: 128
  kmax: 1024

task:
  ranking:
    ks: [1, 10, 32, 64, 128, 512, 1024]

trainer_em:
  lr_agg: 0.00005
  lr_inst: 0.00005

logging:
  wandb:
    project: "MTI_EM_K1024"
    group: "MTI_RandomSplit_K1024"
    tags: ["MTI", "EM", "K1024", "X-Large"]
