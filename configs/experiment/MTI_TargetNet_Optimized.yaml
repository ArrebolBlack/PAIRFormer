# @package _global_
# MTI window-level TargetNet_Optimized. Inherits window_tnopt_core; overrides the keys that
# differ from deepTargetPro_TargetNet_Optimized (snapshot diff: 5 added + 14 changed).
# Note: task.threshold changes from a scalar (0.5) to a dict (fixed + sweep) — a clean
# whole-node replacement by the override.
defaults:
  - _base/window_tnopt_core
  - _self_

experiment:
  name: MTI_TargetNet_Optimized

data:
  name: miRNA_MTI
  split_column: 6
  path:
    train: "data/MTI/MTI_pair_random_split.txt"
    val: "data/MTI/MTI_pair_random_split.txt"
    test: "data/MTI/MTI_pair_random_split.txt"

model:
  dropout: 0.5

run:
  cache_path: "${paths.cache_root}/${data.name}"
  eval_test_after_train: false
  num_workers: 4

task:
  threshold:
    fixed: 0.5
    sweep:
      enabled: true
      start: 0.0
      end: 1.0
      step: 0.01

train:
  monitor: f1
  greater_is_better: true

logging:
  wandb:
    group: MTI_TargetNet_Optimized
    tags: ["TargetNet_Optimized", "MTI", "pair_level"]
