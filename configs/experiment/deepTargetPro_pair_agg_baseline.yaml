# @package _global_
# deepTargetPro pair-level aggregator baseline. Inherits pair_agg_core; overrides only the
# 8 keys the snapshot diff showed differ from miRAW_pair_agg_baseline.
defaults:
  - _base/pair_agg_core
  - _self_

experiment:
  name: deepTargetPro_pair_agg_baseline

data:
  name: mirna_deepTargetPro_pair_level
  path:
    train: "data/deepTargetPro/deepTargetPro_Test1-5_split-ratio-0.9_Train_Validation.txt"
    val: "data/deepTargetPro/deepTargetPro_Test1-5_split-ratio-0.9_Train_Validation.txt"
    test: "data/deepTargetPro/deepTargetPro_Test_0,6-9.txt"
  pair:
    cache_root: pair_cache/deepTargetPro_TargetNet_Optimized_dp-0.1_Test_1-5_Test_0,6-9

logging:
  wandb:
    group: deepTargetPro_pair_agg_baseline
    tags: ["PairAggregator", "deepTargetPro"]
