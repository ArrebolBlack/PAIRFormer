# @package _global_
# k-NN GAT aggregator ablation. Inherits the shared selected-inst body; sets only its
# model block + experiment.name.
defaults:
  - _base/mti_agg_ablation_core
  - _self_

experiment:
  name: MTI_PairGNNAggregator

model:
  arch: PairGNNAggregator
  name: pair_gnn_v0
  in_dim: 387
  d_model: 1024
  dim_ff: 4096
  n_layers: 3
  dropout: 0.1
  ff_activation: gelu
  n_heads: 8
  num_neighbors: 8
