# @package _global_
# Sorted dilated-CNN aggregator ablation. Inherits the shared selected-inst body; sets only
# its model block (CNN-specific: kernel_size, no n_heads/num_neighbors) + experiment.name.
defaults:
  - _base/mti_agg_ablation_core
  - _self_

experiment:
  name: MTI_PairCNNAggregator

model:
  arch: PairCNNAggregator
  name: pair_cnn_v0
  in_dim: 387
  d_model: 1024
  dim_ff: 4096
  n_layers: 4
  dropout: 0.1
  ff_activation: gelu
  kernel_size: 3
