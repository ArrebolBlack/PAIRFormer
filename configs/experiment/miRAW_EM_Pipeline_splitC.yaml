# @package _global_
# split_sensitivity splitC. Inherits em_core (NO bench), overrides only the keys that
# differ from miRAW_EM_Pipeline.
defaults:
  - _base/em_core
  - _self_

experiment:
  name: miRAW_EM_Pipeline_splitC

data:
  path:
    train: "data/rebuttal/split_sensitivity/splitC/miRAW_Train_Validation.txt"
    val: "data/rebuttal/split_sensitivity/splitC/miRAW_Train_Validation.txt"
    test: "data/rebuttal/split_sensitivity/splitC/miRAW_Test.txt"

em:
  policy:
    instance_mode: "hybrid"
  cheap_cache:
    num_workers: 8
  instance_cache:
    num_workers: 8

run:
  num_workers: 8

logging:
  wandb:
    enabled: false
    mode: "disabled"
    project: "split_sensitivity"
    group: "split_sensitivity"
    tags: ["splitC", "EM"]
