# @package _global_
# DeepMirTar pair-level aggregator baseline. Inherits pair_agg_core; overrides the 7 keys
# that differ from miRAW_pair_agg_baseline. Deliberately does NOT set data.pair.cache_root
# (the original omitted it — that is why cache_root was factored out of pair_agg_core).
defaults:
  - _base/pair_agg_core
  - _self_

experiment:
  name: DeepMirTar_pair_agg_baseline

data:
  name: mirna_DeepMirTar_pair_level
  path:
    train: "data/DeepMirTar/train_seed_1234.txt"
    val: "data/DeepMirTar/valid_seed_1234.txt"
    test: "data/DeepMirTar/test_seed_1234.txt"

logging:
  wandb:
    group: DeepMirTar_pair_agg_baseline
    tags: ["PairAggregator", "DeepMirTar"]
