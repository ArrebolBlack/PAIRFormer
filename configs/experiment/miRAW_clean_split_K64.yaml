# @package _global_
# Clean split: zero pair overlap between train/test
# K=64 baseline — standard multi-instance aggregation

defaults:
  - miRAW_EM_Pipeline

experiment_name: "miRAW_clean_split_K64"
experiment:
  name: "miRAW_clean_split_K64"

seed: 2020

paths:
  cache_root: "cache_clean_split"

data:
  path:
    train: "data/rebuttal/miRAW_clean_split/miRAW_Train_Validation.txt"
    val:   "data/rebuttal/miRAW_clean_split/miRAW_Train_Validation.txt"
    test:  "data/rebuttal/miRAW_clean_split/miRAW_Test.txt"

run:
  kmax: 64
  num_epochs: 100
  eval_test_after_train: true
  eval_test_with_last: true
  eval_test_with_best: true
  test_instance_mode: online
  force_overwrite_bootstrap: true

em:
  policy:
    warmup_epochs: 0

trainer_em:
  num_epochs: 100
  monitor: f1
  greater_is_better: true

logging:
  wandb:
    project: "miRAW_clean_split"
    tags: ["clean_split", "K64", "rebuttal"]
