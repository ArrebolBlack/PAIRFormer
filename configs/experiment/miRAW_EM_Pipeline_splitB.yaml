# @package _global_
# split_sensitivity splitB. Inherits em_core (NO bench, as in the original full-copy),
# overrides only the keys the snapshot diff showed differ from miRAW_EM_Pipeline.
defaults:
  - _base/em_core
  - _self_

experiment:
  name: miRAW_EM_Pipeline_splitB

data:
  path:
    train: "data/rebuttal/split_sensitivity/splitB/miRAW_Train_Validation.txt"
    val: "data/rebuttal/split_sensitivity/splitB/miRAW_Train_Validation.txt"
    test: "data/rebuttal/split_sensitivity/splitB/miRAW_Test.txt"

em:
  policy:
    instance_mode: "hybrid"
  cheap_cache:
    num_workers: 8
  instance_cache:
    num_workers: 8

run:
  num_workers: 8

logging:
  wandb:
    enabled: false
    mode: "disabled"
    project: "split_sensitivity"
    group: "split_sensitivity"
    tags: ["splitB", "EM"]
