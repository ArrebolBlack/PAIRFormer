# @package _global_

defaults:
  - MTI_build_selected_inst

experiment_name: MTI_train_selected_inst_ckpt_targetnet_official
experiment:
  name: MTI_train_selected_inst_ckpt_targetnet_official
  task: scalable_selected_inst_build

seed: 2020
device: cuda

paths:
  output_root: outputs
  cache_root: cache
  logs_root: logs

data:
  name: mirna_MTI
  path:
    train: data/MTI/MTI_pair_random_split_orig.txt
    val: data/MTI/MTI_pair_random_split_orig.txt
    test: data/MTI/MTI_pair_random_split_orig.txt
  with_esa: true
  split_column: 6
  col_mirna_seq: 4
  col_mrna_seq: 2
  col_label: 5
  split_map:
    train: train
    val: val
    test: test

run:
  mode: build_selected_inst_cache
  split: train
  batch_size: 64
  num_workers: 4
  has_inst_logit: true

scalable:
  cache_root: ${paths.cache_root}

# 使用现有的通用预训练权重
instance_ckpt_path: checkpoints/TargetNet_officical_pretrained_model.pt

instance_model:
  name: targetnet_optimized
  arch: TargetNet_Optimized
  num_channels: [16, 16, 32, 32]
  num_blocks: [1, 1, 1, 1]
  pool_size: 3
  stem_kernel_size: 5
  block_kernel_size: 3
  skip_connection: true
  dropout: 0.5
  multi_scale: false
  se_type: basic
  use_bn: false
  se_reduction: 8
  target_output_length: 12
  arch_variant: opt4_tiny

model:
  arch: PairSetTransformerAggregator
  name: pair_set_transformer_v0
  in_dim: 387
  d_model: 256
  n_heads: 8
  dim_ff: 512
  dropout: 0.1
  ff_activation: gelu
  n_layers: 3
  block_type: sab
  num_inducing_points: 16
  num_seeds: 1
  use_output_sab: false

token_provider:
  assemble:
    use_inst_emb: true
    use_inst_logit: true
    use_esa: true
    use_pos: true

trainer_pair_selected:
  num_epochs: 40
  log_every: 50
  grad_accum_steps: 1
  clip_grad_norm: 0.0
  use_amp: false
  loss_type: focal
  focal_alpha: 0.4
  focal_gamma: 1.0
  focal_lambda: 1.0
  label_smoothing: true
  smooth_neg: 0.05
  smooth_pos: 0.95
  bce_lambda: 0.01
  pos_weight: 1.0
  optimizer: adamw
  betas: [0.9, 0.999]
  eps: 1e-8
  amsgrad: false
  lr_agg: 3e-4
  wd_agg: 1e-2
  lr_inst: 0.0
  wd_inst: 0.0
  scheduler_agg: cosine
  scheduler_inst: none
  scheduler_t_max: ${run.num_epochs}
  scheduler_step_size: 10
  scheduler_gamma: 0.1
  scheduler_factor: 0.2
  scheduler_patience: 5
  monitor: f1
  greater_is_better: true
