hydra:
  run:
    dir: experiments/issue2/exp4/stage1_seed2025
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.run.dir=experiments/issue2/exp4/stage1_seed2025
    - hydra.mode=RUN
    task:
    - experiment=deepTargetPro_TargetNet_Optimized
    - seed=2025
    - logging.wandb.mode=disabled
    - logging.wandb.enabled=false
    - paths.output_root=experiments/issue2/exp4
  job:
    name: train
    chdir: null
    override_dirname: experiment=deepTargetPro_TargetNet_Optimized,logging.wandb.enabled=false,logging.wandb.mode=disabled,paths.output_root=experiments/issue2/exp4,seed=2025
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /vepfs-mlp2/queue010/20252203765/PAIRFormer_exp4
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /vepfs-mlp2/queue010/20252203765/PAIRFormer_exp4/configs
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /vepfs-mlp2/queue010/20252203765/PAIRFormer_exp4/experiments/issue2/exp4/stage1_seed2025
    choices:
      experiment: deepTargetPro_TargetNet_Optimized
      paths: default
      logging: default
      eval: default
      run: default
      task: binary_classification
      train: default
      model: TargetNet
      data: miRNA_miRAW
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
