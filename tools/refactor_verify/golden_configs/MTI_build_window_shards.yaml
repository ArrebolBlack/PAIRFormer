data:
  name: mirna_MTI
  path:
    train: data/MTI/MTI_pair_random_split.txt
    val: data/MTI/MTI_pair_random_split.txt
    test: data/MTI/MTI_pair_random_split.txt
  with_esa: true
  alignment: extended_seed_alignment
  split_column: 6
  split_map:
    train: train
    val: val
    test: test
  col_mirna_seq: 4
  col_mrna_seq: 2
  col_label: 5
model:
  name: targetnet_default
  arch: TargetNet
  num_channels:
  - 16
  - 16
  - 32
  num_blocks:
  - 2
  - 1
  - 1
  pool_size: 3
  stem_kernel_size: 5
  block_kernel_size: 3
  skip_connection: true
  dropout: 0.5
train:
  optimizer: adamw
  betas:
  - 0.9
  - 0.999
  eps: 1.0e-08
  adam_weight_decay: 0.01
  amsgrad: false
  lr: 0.001
  weight_decay: 0.01
  momentum: 0.9
  scheduler: none
  scheduler_factor: 0.2
  scheduler_patience: 5
  scheduler_t_max: 10
  scheduler_step_size: 10
  scheduler_gamma: 0.1
  pos_weight: 1.0
  label_smoothing: false
  smooth_pos: 1.0
  smooth_neg: 0.0
  loss_type: bce
  focal_gamma: 1.0
  focal_alpha: 0.4
  focal_lambda: 1
  bce_lambda: 0.01
  esa_weighting: false
  esa_scale: 10.0
  esa_lambda_pos: 0.5
  esa_lambda_neg: 0.0
  amp: true
  grad_clip: 1.0
  ema:
    enabled: false
    decay: 0.999
  monitor: f1
  greater_is_better: true
task:
  problem_type: binary_classification
  from_logits: true
  threshold: 0.5
run:
  mode: build_window_shards
  num_epochs: 30
  batch_size: 1024
  num_workers: 4
  pin_memory: true
  cache_path: ${paths.cache_root}/${data.name}
  resume: false
  checkpoint: null
  reduction: max
  train_reduction: ${run.reduction}
  eval_reduction: ${run.reduction}
  test_reduction: ${run.reduction}
  train_softmax_temp: 1.0
  eval_softmax_temp: 1.0
  test_softmax_temp: 1.0
  train_topk: 3
  eval_topk: 3
  test_topk: 3
  ckpt_subdir: checkpoints
  eval_subdir: eval
  ckpt_dir: ${hydra:run.dir}/${run.ckpt_subdir}
  eval_dir: ${hydra:run.dir}/${run.eval_subdir}
  eval_test_after_train: false
  test_splits:
  - test
  split: train
eval:
  save_dir: eval_outputs
  do_threshold_sweep: true
  sweep_num_thresholds: 101
  use_val_best_threshold: false
  best_threshold_path: null
  save_metrics_json: true
  save_report_txt: true
  save_threshold_csv: true
  save_curves_png: true
  roc_curve_file: roc_curve.png
  pr_curve_file: pr_curve.png
logging:
  wandb:
    enabled: false
    project: TargetNet
    entity: null
    mode: online
    group: null
    tags: []
  eval:
    use_wandb: false
    wandb_prefix: eval
paths:
  output_root: outputs
  cache_root: cache
  logs_root: logs
experiment_name: ${experiment.name}
experiment:
  name: MTI_build_window_shards
  task: build_window_shards
seed: 2020
device: cuda
scalable:
  cache_root: ${paths.cache_root}
  esa_min_score: 6.0
  num_workers: 8
  task_pairs: 16
  mp_start_method: spawn
  max_samples_per_shard: 2000000
  label_policy: pseudo_topr
  pseudo_topr: 8
  positive_score: esa
  drop_ignore_at_build: false
  negative_keep_prob: 1.0
  max_pairs: null
