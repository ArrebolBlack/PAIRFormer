data:
  name: mirna_MTI
  path:
    train: data/MTI/MTI_pair_random_split.txt
    val: data/MTI/MTI_pair_random_split.txt
    test: data/MTI/MTI_pair_random_split.txt
  with_esa: true
  alignment: extended_seed_alignment
  split_column: 6
  split_map:
    train: train
    val: val
    test: test
  col_mirna_seq: 4
  col_mrna_seq: 2
  col_label: 5
model:
  name: pair_gnn_moe_v0
  arch: PairGNNMoEAggregator
  num_channels:
  - 16
  - 16
  - 32
  num_blocks:
  - 2
  - 1
  - 1
  pool_size: 3
  stem_kernel_size: 5
  block_kernel_size: 3
  skip_connection: true
  dropout: 0.1
  in_dim: 387
  d_model: 1024
  dim_ff: 4096
  n_layers: 3
  ff_activation: gelu
  n_heads: 8
  num_neighbors: 8
  num_experts: 4
train:
  optimizer: adamw
  betas:
  - 0.9
  - 0.999
  eps: 1.0e-08
  adam_weight_decay: 0.01
  amsgrad: false
  lr: 0.001
  weight_decay: 0.01
  momentum: 0.9
  scheduler: none
  scheduler_factor: 0.2
  scheduler_patience: 5
  scheduler_t_max: 10
  scheduler_step_size: 10
  scheduler_gamma: 0.1
  pos_weight: 1.0
  label_smoothing: false
  smooth_pos: 1.0
  smooth_neg: 0.0
  loss_type: bce
  focal_gamma: 1.0
  focal_alpha: 0.4
  focal_lambda: 1
  bce_lambda: 0.01
  esa_weighting: false
  esa_scale: 10.0
  esa_lambda_pos: 0.5
  esa_lambda_neg: 0.0
  amp: true
  grad_clip: 1.0
  ema:
    enabled: false
    decay: 0.999
  monitor: f1
  greater_is_better: true
task:
  problem_type: binary_classification
  from_logits: true
  threshold: 0.5
run:
  mode: train_pair_selected_inst
  num_epochs: 100
  batch_size: 256
  num_workers: 12
  pin_memory: true
  cache_path: ${paths.cache_root}/${data.name}
  resume: false
  checkpoint: null
  reduction: max
  train_reduction: ${run.reduction}
  eval_reduction: ${run.reduction}
  test_reduction: ${run.reduction}
  train_softmax_temp: 1.0
  eval_softmax_temp: 1.0
  test_softmax_temp: 1.0
  train_topk: 3
  eval_topk: 3
  test_topk: 3
  ckpt_subdir: checkpoints
  eval_subdir: eval
  ckpt_dir: ${hydra:run.dir}/${run.ckpt_subdir}
  eval_dir: ${hydra:run.dir}/${run.eval_subdir}
  eval_test_after_train: false
  test_splits:
  - test
  split: train
  val_split: val
  kmax: 64
  load_instance_into_ckpt: false
  eval_test_with_last: true
  eval_test_with_best: false
  eval_fixed_threshold: true
  eval_with_val_best_threshold: false
  eval_with_threshold_sweep: false
  sweep_num_thresholds: 101
eval:
  save_dir: eval_outputs
  do_threshold_sweep: true
  sweep_num_thresholds: 101
  use_val_best_threshold: false
  best_threshold_path: null
  save_metrics_json: true
  save_report_txt: true
  save_threshold_csv: true
  save_curves_png: true
  roc_curve_file: roc_curve.png
  pr_curve_file: pr_curve.png
logging:
  wandb:
    enabled: false
    project: TargetNet
    entity: null
    mode: online
    group: null
    tags: []
  eval:
    use_wandb: false
    wandb_prefix: eval
paths:
  output_root: outputs
  cache_root: cache
  logs_root: logs
experiment_name: ${experiment.name}
experiment:
  name: MTI_PairGNNMoEAggregator
  task: pair_train_selected_inst
seed: 2020
device: cuda
scalable:
  cache_root: ${paths.cache_root}
token_provider:
  assemble:
    use_inst_emb: true
    use_inst_logit: true
    use_esa: true
    use_pos: true
instance_ckpt_path: checkpoints/MTI_TargetNet_Optimized/checkpoints/best.pt
instance_model:
  name: targetnet_optimized
  arch: TargetNet_Optimized
  num_channels:
  - 16
  - 16
  - 32
  - 32
  num_blocks:
  - 1
  - 1
  - 1
  - 1
  pool_size: 3
  stem_kernel_size: 5
  block_kernel_size: 3
  skip_connection: true
  dropout: 0.5
  multi_scale: false
  se_type: basic
  use_bn: false
  se_reduction: 8
  target_output_length: 12
  arch_variant: opt4_tiny
trainer_pair_selected:
  num_epochs: ${run.num_epochs}
  log_every: 50
  grad_accum_steps: 1
  clip_grad_norm: 0.0
  use_amp: false
  loss_type: focal
  focal_alpha: 0.4
  focal_gamma: 1.0
  focal_lambda: 1.0
  label_smoothing: true
  smooth_neg: 0.05
  smooth_pos: 0.95
  bce_lambda: 0.01
  pos_weight: 1.0
  optimizer: adamw
  betas:
  - 0.9
  - 0.999
  eps: 1.0e-08
  amsgrad: false
  lr_agg: 5.0e-05
  wd_agg: 0.01
  lr_inst: 0.0
  wd_inst: 0.0
  scheduler_agg: cosine
  scheduler_inst: none
  scheduler_t_max: ${run.num_epochs}
  monitor: f1
  greater_is_better: true
