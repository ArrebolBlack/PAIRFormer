# MTI selected-inst —— 任务A：复用 exp8 已建好的 ST 选择器缓存（最快）
# 提交：volc ml_task submit -c deploy/volc/task-mti-reuse.yaml
# 字段名为 CLI 输入格式（已据实测报错改：TaskName/ImageUrl/Entrypoint/ResourceQueueID/Flavor）。
TaskName: pf-mti-st05-reuse
ImageUrl: cr-mlp-cn-beijing.cr.volces.com/public/yjq:latest
Entrypoint: "bash /vepfs-mlp2/queue010/20252203765/PAIRFormer/scripts/task_mti_selected.sh"
Framework: PyTorchDDP
ResourceQueueID: q-20260318205115-lvfng
Priority: 4
ActiveDeadlineSeconds: 864000
Envs:
  - {Name: MODE,      Value: reuse}
  - {Name: KMAX,      Value: "512"}
  - {Name: BATCH,     Value: "64"}        # 每卡；8 卡全局 512
  - {Name: CACHE_DIR, Value: /vepfs-mlp2/queue010/20252203765/PAIRFormer_exp8_final/cache_mti_full_st05_retrain_r4_v3relbl}
  # 复现 exp8 主结果再加：
  # - {Name: EXTRA, Value: "run.num_epochs=100 model.d_model=1024 model.n_layers=4"}
TaskRoleSpecs:
  - RoleName: worker
    RoleReplicas: 1
    Flavor: ml.pni2.28xlarge     # 单机 8 卡；若报无效规格，UI 下拉确认真名后改这里
Storages:
  - Type: Vepfs
    VepfsId: vepfs-cnbj2c98dea54433
    MountPath: /vepfs-mlp2/queue010/20252203765
    SubPath: queue010/20252203765
    ReadOnly: false
Preemptible: true
CacheType: Cloudfs
RetryOptions:
  EnableRetry: true
  MaxRetryTimes: 5
  IntervalSeconds: 120
  EnableReserveResourceOnRetry: true
  PolicySets: [InstanceReclaimed, Failed, MachineFailure, VecclHangDetectionFailed, LogDetectionFailed, PythonDetectionFailed]
