# =============================================================================
# MTI selected-inst —— 8 卡「填满显存」大模型大 batch SCALING 实验
# 提交:volc ml_task submit -c deploy/volc/task-mti-scaling.yaml
# 目的:把 8×A100-80G 显存吃到 ~75GB/卡,最大化单 run 8 卡利用率(非论文复现,自由调)。
#
# ── 选型(来自显存模型分析)────────────────────────────────────────────────
#  本任务是「激活受限」(kmax=64 很小),填显存最稳的办法是「大模型 + 中等 batch」,
#  而不是「小模型 + 超大 batch」(后者全局 batch 上万、AdamW 无 LAMB,易掉点)。
#  Config C(本文件):d4096 / L8 / ff16384 / H32 ≈ 20 亿参数,batch 640/卡 → 估 ~75GB。
#    · 参数态(fp32+AdamW)≈ 31GB,激活 ≈ 640×68MB ≈ 44GB,合计 ~75GB(±25%,务必先探针)。
#  备选(改 EXTRA 的 d_model/n_layers + 下方 BATCH/lr 即可):
#    A 宽:d2048/L8/ff8192/H16, BATCH=1792, 全局14336, lr=2.8e-3(偏 batch 重,慎用)
#    B 深:d2048/L12/ff8192/H16, BATCH=1280, 全局10240, lr=2e-3
#
# ── LR 必须手动随全局 batch 线性放大(代码不自动)────────────────────────────
#    lr_agg = 1e-4 × (8×BATCH) / 512 。本文件 BATCH=640 → 全局5120 → lr=1e-3。
#    若你改 BATCH,务必同步改 EXTRA 里的 lr_agg,否则 LR 偏小、静默不报错。
#
# ── 显存务必先探针(单卡)再正式提!估值 ±25%,可能 OOM ──────────────────────
#    见 docs / 我给的探针命令:单卡跑 num_epochs=1 + scalable.max_train_pairs=20000,
#    逐步加 run.batch_size,watch nvidia-smi 找峰值落在 70~78GB 的最大 batch。
#    OOM → BATCH 降到 512(lr=8e-4);有余量 → 升到 768(lr≈1.2e-3)。
#
# 注:in_dim / kmax / run.batch_size 由 task_mti_selected.sh 注入,EXTRA 里不要再写(重复会 Hydra 报错)。
#     scheduler_t_max 默认 = ${run.num_epochs} 自动跟随,无需写。warmup_steps 不在基础 YAML,必须用 + 前缀。
# =============================================================================
TaskName: pf-mti-scaling-d4096L8
ImageUrl: cr-mlp-cn-beijing.cr.volces.com/public/yjq:latest
Entrypoint: "bash /vepfs-mlp2/queue010/20252203765/PAIRFormer/scripts/task_mti_selected.sh"
Framework: PyTorchDDP
ResourceQueueID: q-20260318205115-lvfng
Priority: 4
ActiveDeadlineSeconds: 864000
Envs:
  - {Name: MODE,      Value: reuse}
  # 三轮探针结论:d4096/L8 = 2B 模型,光参数态(fp32+AdamW)~35GB(占半张卡),AMP batch640 也 OOM(PMA ~80GB)
  #   → 2B 模型在 80G 上 batch 只能 ~384,是"大模型"但不是"大batch"。
  # 「大模型 + 大batch + 填满」三者兼得的甜点:d2048/L8(4.9 亿,7× 基线),状态仅 ~8GB,batch 能上 ~1024。
  # 本文件默认走 d2048/L8(fp32 干净);想要 2B 巨模型见文末 §giant(d4096+AMP+batch≤384)。
  - {Name: BATCH,     Value: "768"}        # 每卡;8 卡全局 6144。先探针,有余量往上加(1024/1152→~70GB),同步改 lr
  - {Name: NW,        Value: "6"}
  - {Name: PYTORCH_CUDA_ALLOC_CONF, Value: "expandable_segments:True"}   # 抗碎片
  # scaling 用 base/topk cache(与 d1024 基线同一份 → 结果可比);也可换 st05_v3relbl
  - {Name: CACHE_DIR, Value: /vepfs-mlp2/queue010/20252203765/PAIRFormer_exp8_final/cache_mti_full_topk_retrain_r4_v2relbl}
  # d4096/L8 巨模型 + 全局 5120 + lr 1e-3 + warmup50(≤每epoch步数~65)+ cosine 衰减 + 裁剪;150 epoch(更多)
  # d2048/L8/ff8192/H32(4.9 亿)+ 全局6144 + lr1.2e-3 + warmup + cosine + 裁剪;150 epoch;fp32(无 NaN 风险)
  - {Name: EXTRA, Value: "run.num_epochs=150 model.d_model=2048 model.dim_ff=8192 model.n_layers=8 model.n_heads=32 model.block_type=sab model.num_seeds=1 model.ff_activation=gelu model.dropout=0.1 trainer_pair_selected.lr_agg=1.2e-3 trainer_pair_selected.scheduler_agg=cosine trainer_pair_selected.clip_grad_norm=1.0 +trainer_pair_selected.warmup_steps=50"}
  # 想更深/更宽的 fp32 scaling 点:d2048/L12(~7 亿,batch 降到 ~512)或 d3072/L8。
  #
  # ───────────────────────────── §giant:2B 巨模型(d4096/L8)──────────────────────────────
  # 只有它必须 AMP(fp16)且 batch≤384(状态 35GB)。把上面 BATCH 改 384、EXTRA 换成:
  #   "run.num_epochs=150 model.d_model=4096 model.dim_ff=16384 model.n_layers=8 model.n_heads=32 \
  #    model.block_type=sab model.num_seeds=1 model.ff_activation=gelu model.dropout=0.1 \
  #    trainer_pair_selected.use_amp=true trainer_pair_selected.lr_agg=6e-4 \
  #    trainer_pair_selected.scheduler_agg=cosine trainer_pair_selected.clip_grad_norm=1.0 +trainer_pair_selected.warmup_steps=50"
  #   (lr=6e-4=1e-4×(8×384)/512;fp16 无 bf16 有 NaN 风险,clip+warmup 兜底,盯 loss)。先单卡探针 batch384 确认不 OOM。
TaskRoleSpecs:
  - RoleName: worker
    RoleReplicas: 1
    Flavor: ml.pni2.28xlarge     # 单机 8 卡(NVLink);scaling 单 run 不跨节点
Storages:
  - Type: Vepfs
    VepfsId: vepfs-cnbj2c98dea54433
    MountPath: /vepfs-mlp2/queue010/20252203765
    SubPath: queue010/20252203765
    ReadOnly: false
Preemptible: true
CacheType: Cloudfs
RetryOptions:
  EnableRetry: true
  MaxRetryTimes: 5
  IntervalSeconds: 120
  EnableReserveResourceOnRetry: true
  PolicySets: [InstanceReclaimed, Failed, MachineFailure, VecclHangDetectionFailed, LogDetectionFailed, PythonDetectionFailed]
