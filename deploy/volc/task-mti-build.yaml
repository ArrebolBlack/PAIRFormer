# MTI selected-inst —— 任务B：重建缓存再训练（对照组，验证预建缓存可复用 + 重构对该缓存等价）
# 提交：volc ml_task submit -c deploy/volc/task-mti-build.yaml
# 跑完与任务A比 $RUNDIR 下 test 指标：一致 = 预建缓存可放心复用。
TaskName: pf-mti-st05-build
ImageUrl: cr-mlp-cn-beijing.cr.volces.com/public/yjq:latest
Entrypoint: "bash /vepfs-mlp2/queue010/20252203765/PAIRFormer/scripts/task_mti_selected.sh"
Framework: PyTorchDDP
ResourceQueueID: q-20260318205115-lvfng
Priority: 4
ActiveDeadlineSeconds: 864000
Envs:
  - {Name: MODE,       Value: build}
  - {Name: KMAX,       Value: "512"}
  - {Name: BATCH,      Value: "64"}
  - {Name: CACHE_ROOT, Value: /vepfs-mlp2/queue010/20252203765/runs/mti_build/cache}
  # build 需 MTI cheap/instance ckpt：脚本默认用 exp8 sharded 真身；要覆盖就解开下面两行：
  # - {Name: CHEAP_CKPT, Value: checkpoints/MTI_CheapCTSNet_shard_v1_compact_r4/best.pt}
  # - {Name: INST_CKPT,  Value: checkpoints/MTI_TargetNet_Optimized_shard_v2_relabel_top4/best.pt}
TaskRoleSpecs:
  - RoleName: worker
    RoleReplicas: 1
    Flavor: ml.pni2.28xlarge     # 单机 8 卡；若报无效规格，UI 下拉确认真名后改这里
Storages:
  - Type: Vepfs
    VepfsId: vepfs-cnbj2c98dea54433
    MountPath: /vepfs-mlp2/queue010/20252203765
    SubPath: queue010/20252203765
    ReadOnly: false
Preemptible: true
CacheType: Cloudfs
RetryOptions:
  EnableRetry: true
  MaxRetryTimes: 5
  IntervalSeconds: 120
  EnableReserveResourceOnRetry: true
  PolicySets: [InstanceReclaimed, MachineFailure, VecclHangDetectionFailed]   # 只对抢占/硬件/NCCL挂重试;代码bug(Failed/Python/Log)直接失败不重试
